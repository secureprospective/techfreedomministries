<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tech Freedom Ministries — Break from the digital grid.</title>
  <link rel="stylesheet" href="/src/styles/fonts.css">
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--tfm-parchment);
      color: var(--tfm-near-black);
      font-family: var(--tfm-sans);
      min-height: 100vh;
    }
    #root { min-height: 100vh; display: flex; flex-direction: column; }
    main  { flex: 1; }
    /* page enter transition */
    .tfm-page {
      animation: tfmRise 320ms cubic-bezier(.2,0,.2,1);
    }
    @keyframes tfmRise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Atoms first; others depend on them -->
  <script type="text/babel" src="/src/components/Atoms.jsx"></script>
  <script type="text/babel" src="/src/components/Nav.jsx"></script>
  <script type="text/babel" src="/src/components/Hero.jsx"></script>
  <script type="text/babel" src="/src/components/EventCard.jsx"></script>
  <script type="text/babel" src="/src/components/EventsList.jsx"></script>
  <script type="text/babel" src="/src/components/Roadmap.jsx"></script>
  <script type="text/babel" src="/src/components/Oath.jsx"></script>
  <script type="text/babel" src="/src/components/About.jsx"></script>
  <script type="text/babel" src="/src/components/Footer.jsx"></script>
  <script type="text/babel" src="/src/components/RsvpModal.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect } = React;

    function HomePage({ setRoute, onRsvp }) {
      const featured = EVENTS.slice(0, 3);
      return (
        <div className="tfm-page">
          <Hero
            onFindEvent={() => setRoute("events")}
            onReadOath={() => setRoute("oath")}
          />

          {/* Featured events */}
          <section style={{ maxWidth: 1100, margin: "0 auto", padding: "32px 36px 80px" }}>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 24 }}>
              <div>
                <Eyebrow>Next Three Events</Eyebrow>
                <div style={{ height: 14 }} />
                <Proclamation as="h2" size={32}
                  strong="The next three."
                  italic="Pick one."
                />
              </div>
              <LinkButton onClick={() => setRoute("events")}>See all events →</LinkButton>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              {featured.map(e => <EventCard key={e.id} event={e} onRsvp={onRsvp} />)}
            </div>
          </section>

          <Roadmap />

          {/* Call to action band */}
          <section style={{
            background: "var(--tfm-near-black)",
            color: "var(--tfm-parchment)",
            padding: "80px 36px",
            textAlign: "center",
          }}>
            <div style={{ maxWidth: 720, margin: "0 auto" }}>
              <div style={{
                fontFamily: "var(--tfm-sans)", fontSize: 11, letterSpacing: "0.22em",
                textTransform: "uppercase", color: "var(--tfm-muted-gold)",
              }}>
                A note to whoever is reading this
              </div>
              <div style={{
                width: 40, height: 1, background: "var(--tfm-bright-gold)",
                margin: "14px auto 24px",
              }} />
              <h2 style={{
                fontFamily: "var(--tfm-serif)", fontWeight: 700, fontSize: 38,
                lineHeight: 1.15, margin: 0, color: "var(--tfm-parchment)",
              }}>
                This event cost you nothing.{" "}
                <em style={{ fontStyle: "italic", fontWeight: 400, color: "var(--tfm-bright-gold)" }}>
                  Help us reach the next city.
                </em>
              </h2>
              <div style={{ display: "flex", gap: 12, justifyContent: "center", marginTop: 28 }}>
                <Button onClick={() => setRoute("events")} style={{ background: "var(--tfm-parchment)", color: "var(--tfm-near-black)" }}>
                  Find an event
                </Button>
                <button
                  onClick={() => setRoute("about")}
                  style={{
                    fontFamily: "var(--tfm-sans)", fontSize: 13, padding: "12px 22px",
                    background: "transparent", color: "var(--tfm-parchment)",
                    border: "1px solid rgba(244,240,230,0.4)", borderRadius: 2, cursor: "pointer",
                    letterSpacing: "0.01em",
                  }}
                >
                  Learn about TFM
                </button>
              </div>
            </div>
          </section>
        </div>
      );
    }

    function App() {
      const [route, setRoute]   = useState("home");
      const [rsvpFor, setRsvp]  = useState(null);

      useEffect(() => { window.scrollTo({ top: 0, behavior: "instant" }); }, [route]);

      let page;
      if (route === "home")    page = <HomePage setRoute={setRoute} onRsvp={setRsvp} />;
      else if (route === "events")   page = <div className="tfm-page"><EventsList onRsvp={setRsvp} /></div>;
      else if (route === "roadmap")  page = <div className="tfm-page"><Roadmap /></div>;
      else if (route === "oath")     page = <div className="tfm-page"><Oath /></div>;
      else if (route === "about")    page = <div className="tfm-page"><About /></div>;

      return (
        <React.Fragment>
          <Nav route={route} setRoute={setRoute} />
          <main>{page}</main>
          <Footer setRoute={setRoute} />
          {rsvpFor && <RsvpModal event={rsvpFor} onClose={() => setRsvp(null)} />}
        </React.Fragment>
      );
    }

    // Mount after all Babel scripts settle (small tick).
    setTimeout(() => {
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    }, 80);
  </script>
</body>
</html>
